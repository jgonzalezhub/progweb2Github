<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat en Tiempo Real — Acceso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p.subtitle { color: #666; margin-bottom: 28px; font-size: 0.9rem; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid #e5e7eb; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: #374151; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input:focus { border-color: #2563eb; }
    button[type="submit"] { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
    button[type="submit"]:hover { background: #1d4ed8; }
    .alert { padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .alert.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💬 Chat en Tiempo Real</h1>
    <p class="subtitle">Inicia sesión o regístrate para comenzar</p>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Iniciar sesión</div>
      <div class="tab" onclick="switchTab('register')">Registrarse</div>
    </div>

    <div id="alert" class="alert"></div>

    <!-- Login -->
    <div id="panel-login" class="panel active">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="correo@ejemplo.com" required />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••" required />
        </div>
        <button type="submit">Entrar</button>
      </form>
    </div>

    <!-- Register -->
    <div id="panel-register" class="panel">
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="reg-name" placeholder="Tu nombre" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required />
        </div>
        <button type="submit">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script>
    // Redirigir si ya hay sesión
    if (localStorage.getItem('token')) {
      window.location.href = '/chat.html';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab:nth-child(${tab === 'login' ? 1 : 2})`).classList.add('active');
      document.getElementById(`panel-${tab}`).classList.add('active');
      hideAlert();
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert ${type}`;
      el.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alert').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return showAlert(data.message || 'Error al iniciar sesión');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/chat.html';
      } catch {
        showAlert('Error de conexión');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) return showAlert(data.message || 'Error al registrarse');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/chat.html';
      } catch {
        showAlert('Error de conexión');
      }
    }
  </script>
</body>
</html>
